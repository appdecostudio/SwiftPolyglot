name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    name: Build & Release
    runs-on: macOS-15
    steps:
      - name: git checkout
        uses: actions/checkout@v3

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.0.app

      - name: Build universal binary
        run: swift build -c release --arch arm64 --arch x86_64

      - name: Package binary
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          mkdir -p staging
          cp .build/apple/Products/Release/swiftpolyglot staging/
          cd staging
          tar -czf ../swiftpolyglot-${VERSION}-macos.tar.gz swiftpolyglot
          cd ..
          shasum -a 256 swiftpolyglot-${VERSION}-macos.tar.gz > swiftpolyglot-${VERSION}-macos.tar.gz.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            swiftpolyglot-*-macos.tar.gz
            swiftpolyglot-*-macos.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
